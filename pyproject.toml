[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vortex-ai-gateway"
version = "0.0.1a1"
description = "Multi-provider LLM gateway with provider abstraction, PII guardrails, rate limiting, and Redis load balancing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "httpx>=0.25.1",
]

# Dev tooling is a dependency-group, not an extra: it is installed by
# `uv sync` and never published as part of the distribution.
[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "respx>=0.21.1",
    "pre-commit>=3.5.0",
    # The `lua` extra pulls in lupa, so fakeredis executes the limiter's real
    # Lua script rather than a Python re-implementation of it. A rate limiter
    # tested against a re-implementation tests the re-implementation.
    "fakeredis[lua]>=2.37.1",
]

# `types-redis` is deliberately absent. redis-py ships `py.typed` from 5.0, and
# the stub package still describes the 4.x API — installing it shadows the real
# hints and makes mypy check the wrong surface (`aclose` "does not exist" while
# the runtime has had it for three majors).

# Key management is an operator task, not an HTTP one: minting a credential
# over the same API it authenticates is a bootstrapping problem (ADR-003).
[project.scripts]
vortex-keys = "vortex_ai_gateway.cli:main"

# The per-directory agent instruction files are guidance for whoever edits this
# tree, not part of what the gateway ships. Hatchling includes every file under
# the package directory, so without this `providers/CLAUDE.md` lands in the
# site-packages of anyone who installs the wheel (ADR-023). Only `exclude` is
# set here on purpose — naming `packages` would replace hatchling's src/
# auto-detection with a list to keep in step by hand.
[tool.hatch.build.targets.wheel]
exclude = ["**/CLAUDE.md", "**/AGENTS.md"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "RUF"]
ignore = ["E501"]  # Line too long - handled by formatter

[tool.ruff.lint.per-file-ignores]
# The provider error taxonomy is named for what happened, not for the fact that
# it is an exception: `except ProviderRateLimited:` reads as a sentence and
# `except ProviderRateLimitedError:` does not. N818's "must end in Error" rule
# is waived in that one module, and nowhere else.
"src/vortex_ai_gateway/providers/errors.py" = ["N818"]

[tool.ruff.format]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
explicit_package_bases = true
mypy_path = "src"
exclude = ["tests/"]

# Per-module `ignore_missing_imports` overrides go here as untyped third-party
# packages are actually imported. Adding them pre-emptively makes mypy report
# "unused section(s)" on every run.

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `pythonpath` entry on purpose. With a src/ layout the tests must import
# the *installed* package; putting src/ on sys.path here would defeat that and
# let a broken build pass. Run `uv sync` (which installs the project) first.
addopts = "--cov=vortex_ai_gateway --cov-report=term-missing --strict-markers"
asyncio_mode = "auto"
